openapi: 3.0.1
info:
  title: IBC-GO - gRPC Gateway docs
  description: A REST interface for IBC state queries (ibc-go v8.x, as deployed on Osmosis v31). Generated from the osmosis
    chain repository's swagger.
  version: ibc-go v8
servers:
- url: https://lcd.osmosis.zone
  description: Osmosis mainnet LCD / gRPC-gateway
- url: https://lcd-test.osmosis.zone
  description: Osmosis testnet LCD / gRPC-gateway
paths:
  /ibc/core/client/v1/client_states:
    get:
      summary: ClientStates queries all the IBC light clients of a chain.
      operationId: ClientStates
      responses:
        '200':
          description: A successful response.
          content:
            '*/*':
              schema:
                type: object
                properties:
                  client_states:
                    type: array
                    items:
                      type: object
                      properties:
                        client_id:
                          type: string
                          title: client identifier
                        client_state:
                          title: client state
                          type: object
                          properties:
