                            \ State\n - STATE_INIT: A channel has just started the opening handshake.\n - STATE_TRYOPEN: A\
                            \ channel has acknowledged the handshake step on the counterparty chain.\n - STATE_OPEN: A channel\
                            \ has completed the handshake. Open channels are\r\nready to send and receive packets.\n - STATE_CLOSED:\
                            \ A channel has been closed and can no longer be used to send or receive\r\npackets.\n - STATE_FLUSHING:\
                            \ A channel has just accepted the upgrade handshake attempt and is flushing in-flight packets.\n\
                            \ - STATE_FLUSHCOMPLETE: A channel has just completed flushing any in-flight packets."
