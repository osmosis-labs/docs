      parameters:
      - name: pagination.key
        description: "key is a value returned in PageResponse.next_key to begin\r\nquerying the next page most efficiently.\
          \ Only one of offset or key\r\nshould be set."
        in: query
        required: false
        schema:
          type: string
          format: byte
      - name: pagination.offset
        description: "offset is a numeric offset that can be used when key is unavailable.\r\nIt is less efficient than using\
          \ key. Only one of offset or key should\r\nbe set."
        in: query
        required: false
        schema:
          type: string
          format: uint64
      - name: pagination.limit
        description: "limit is the total number of results to be returned in the result page.\r\nIf left empty it will default\
          \ to a value to be set by each app."
        in: query
        required: false
        schema:
          type: string
          format: uint64
      - name: pagination.count_total
        description: "count_total is set to true  to indicate that the result set should include\r\na count of the total number\
          \ of items available for pagination in UIs.\r\ncount_total is only respected when offset is used. It is ignored\
          \ when key\r\nis set."
        in: query
        required: false
        schema:
          type: boolean
      - name: pagination.reverse
        description: "reverse is set to true if results are to be returned in the descending order.\r\n\r\nSince: cosmos-sdk\
          \ 0.43."
        in: query
        required: false
        schema:
          type: boolean
      tags:
      - Client (core)
